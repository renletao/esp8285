[env:esp8285]
platform  = espressif8266
board     = esp8285
framework = arduino

monitor_speed = 9600
upload_speed  = 115200

# Select a real USB-UART adapter before upload. This avoids stale Bluetooth
# COM ports being selected when Windows reports duplicate port names.
extra_scripts = pre:scripts/select_upload_port.py

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
